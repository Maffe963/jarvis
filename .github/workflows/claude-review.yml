# Reviews every pull request (once it's out of draft) against REVIEW.md: safety first, then correctness and
# efficiency, as inline comments plus a summary. Needs the CLAUDE_CODE_OAUTH_TOKEN repository secret (run
# `claude setup-token` and add it under Settings > Secrets and variables > Actions); without it this is skipped.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review the pull request
        if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request by following REVIEW.md in the repository root: safety first, then
            correctness, then efficiency. Only report real problems, each with the file, line, a concrete case
            where it goes wrong, and the fix. Put each problem as an inline comment on its line, then post one
            short summary comment with `gh pr comment` that says whether anything is blocking (any safety
            problem or real bug is). If there are no problems, the summary says so in one line.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
