<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  /* ---------- shared layout ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; overflow: hidden; transition: background .4s; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: var(--border);
           background: var(--header-bg); flex-wrap: wrap; }
  header h1 { margin: 0; font: var(--title-font); letter-spacing: var(--title-spacing); color: var(--accent);
              text-shadow: var(--title-shadow); }
  .chips { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; align-items: center; }
  .chip { padding: 3px 10px; border: var(--chip-border); border-radius: var(--chip-radius); color: var(--muted);
          font-size: 12px; background: var(--chip-bg); }
  .chip b { color: var(--text); font-weight: 700; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #777; margin-right: 6px; }
  .live .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .themes { display: flex; gap: 4px; padding: 3px; border-radius: var(--chip-radius); background: var(--chip-bg); border: var(--chip-border); }
  .themes button { padding: 4px 10px; font-size: 12px; border: none; background: none; color: var(--muted); box-shadow: none; }
  .themes button.on, body .themes button.on { background: var(--accent); color: var(--accent-text); }
  .emoji { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
  main { display: grid; grid-template-columns: 1fr 390px; min-height: 0; }
  #map { position: relative; min-height: 0; overflow: hidden; background: var(--map-bg); }
  #map svg { width: 100%; height: 100%; display: block; }
  .empty { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); color: var(--empty-text);
           text-align: center; max-width: 520px; font-size: 13px; padding: 8px 14px; border-radius: 10px; background: var(--empty-bg); }
  aside { border-left: var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { margin: 0; padding: 12px 16px 6px; font: var(--section-font); letter-spacing: .14em; color: var(--muted); }
  #approvals:empty { display: none; }
  .approval { margin: 8px 12px; padding: 10px 12px; border: var(--approval-border); border-radius: var(--radius);
              background: var(--approval-bg); animation: glow 1.6s ease-in-out infinite; }
  .approval .who { color: var(--bad); font-size: 12px; font-weight: 800; }
  .approval .q { margin: 4px 0 8px; }
  .approval button { margin-right: 6px; }
  #feed { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
  .item { padding: 7px 10px; margin: 5px 0; border-radius: var(--item-radius); background: var(--item-bg);
          border-left: 4px solid var(--line); font-size: 13px; word-wrap: break-word; color: var(--item-text); box-shadow: var(--item-shadow); }
  .item .meta { color: var(--item-meta); font-size: 11px; margin-bottom: 2px; }
  .item.msg { border-left-color: var(--msg); } .item.act { border-left-color: var(--accent); }
  .item.res { border-left-color: var(--good); } .item.you { border-left-color: var(--you); }
  .item.jar { border-left-color: var(--accent); background: var(--item-jarvis-bg); } .item.warn { border-left-color: var(--bad); }
  .item .more { color: var(--accent); font-size: 12px; text-decoration: none; }
  footer { display: flex; gap: 10px; padding: 12px 20px; border-top: var(--border); background: var(--footer-bg); }
  input[type=text] { flex: 1; background: var(--input-bg); border: var(--input-border); border-radius: var(--radius); color: var(--input-text);
                     padding: 10px 14px; font: inherit; outline: none; }
  input[type=text]:focus { box-shadow: 0 0 0 3px var(--focus); }
  input::placeholder { color: var(--placeholder); }
  button { background: var(--btn-bg); color: var(--btn-text); border: var(--btn-border); border-radius: var(--radius);
           padding: 7px 14px; font: inherit; font-weight: 700; cursor: pointer; box-shadow: var(--btn-shadow); }
  button:active { transform: translateY(2px); box-shadow: none; }
  button.danger { background: var(--btn-danger); } button.good { background: var(--btn-good); }
  #drawer { position: absolute; top: 14px; right: 14px; width: min(420px, calc(100% - 28px)); max-height: calc(100% - 28px);
            overflow-y: auto; background: var(--drawer-bg); border: var(--drawer-border); border-radius: var(--radius-lg);
            padding: 16px; display: none; color: var(--drawer-text); box-shadow: var(--drawer-shadow); }
  #drawer.open { display: block; }
  #drawer h3 { margin: 0 0 2px; font: var(--drawer-title-font); }
  #drawer .role { color: var(--drawer-muted); margin-bottom: 10px; }
  #drawer .section { margin-top: 12px; font: var(--section-font); letter-spacing: .12em; color: var(--drawer-muted); }
  #drawer pre { white-space: pre-wrap; background: var(--pre-bg); border: var(--pre-border); border-radius: 8px; padding: 10px;
                font: 13px/1.45 var(--font); max-height: 260px; overflow-y: auto; margin: 6px 0 0; color: var(--drawer-text); }
  #drawer .steps div { padding: 3px 0; border-bottom: 1px dashed var(--step-line); font-size: 12.5px; }
  #drawer .row { display: flex; gap: 8px; margin-top: 10px; }
  .close { float: right; background: none !important; border: none !important; color: var(--drawer-muted); font-size: 22px;
           padding: 0 4px; box-shadow: none !important; }
  .node { cursor: pointer; }
  .node text { text-anchor: middle; pointer-events: none; }
  .label { fill: var(--node-label); font: var(--node-font); }
  .sub { fill: var(--node-sub); font-size: 11px; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 transparent; } 50% { box-shadow: 0 0 16px var(--bad); } }
  /* ---------- 3D view: scene, labels, tooltip, right-click menu ---------- */
  #scene3d { position: absolute; inset: 0; display: none; }
  body.three #scene3d { display: block; } body.three #svg { display: none; }
  .lbl3d { text-align: center; transform: translateY(-6px); pointer-events: none; white-space: nowrap; }
  .lbl3d .name { font: var(--node-font); font-size: 15px; color: var(--node-label); text-shadow: 0 1px 3px #000c;
                 display: inline-block; padding: 1px 8px; border-radius: 6px; background: #0009; }
  .lbl3d .state, .lbl3d .doing { padding: 0 6px; border-radius: 5px; background: #0007; margin-top: 2px; }
  .lbl3d .name, .lbl3d .state, .lbl3d .doing { display: table; margin-left: auto; margin-right: auto; }  /* stacked, centred */
  body.village .lbl3d .name, body.village .lbl3d .state, body.village .lbl3d .doing { background: none; }
  .lbl3d .state { font-size: 12px; color: var(--c, var(--node-sub)); font-weight: 700; text-shadow: 0 1px 3px #000c; }
  .lbl3d .doing { font-size: 11.5px; color: var(--node-sub); text-shadow: 0 1px 3px #000c; }
  .lbl3d .bubble { display: inline-block; font-size: 18px; background: #fff; border: 2px solid #4a2c0a; border-radius: 50%;
                   width: 32px; height: 32px; line-height: 28px; margin-bottom: 2px; animation: bob 1.2s ease-in-out infinite;
                   font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
  .lbl3d .badge { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; margin-right: 4px; }
  body.village .lbl3d .name, body.village .lbl3d .state, body.village .lbl3d .doing {
    -webkit-text-stroke: 3px #3b2208; paint-order: stroke fill; text-shadow: none; }
  body.hud .lbl3d .name { letter-spacing: .12em; text-shadow: 0 0 8px #4fe3ffaa; }
  #tip { position: fixed; z-index: 20; pointer-events: none; display: none; max-width: 280px; padding: 8px 11px; border-radius: var(--radius);
         background: var(--drawer-bg); color: var(--drawer-text); border: var(--drawer-border); font-size: 12.5px; box-shadow: 0 6px 20px #0008; }
  #tip b { font-size: 13.5px; }
  #ctx { position: fixed; z-index: 21; display: none; min-width: 170px; padding: 6px; border-radius: var(--radius);
         background: var(--drawer-bg); border: var(--drawer-border); box-shadow: 0 8px 26px #000a; }
  #ctx button { display: block; width: 100%; text-align: left; margin: 2px 0; box-shadow: none; }
  #hint { position: absolute; left: 14px; bottom: 12px; font-size: 11.5px; color: var(--empty-text); background: var(--empty-bg);
          padding: 4px 9px; border-radius: 8px; opacity: .85; pointer-events: none; }
  .item { cursor: default; } .item[data-agent]:not([data-agent=""]) { cursor: pointer; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 55% 45%; } aside { border-left: none; border-top: var(--border); } }

  /* ---------- theme: Command Center (default) ---------- */
  body.command {
    --font: "Segoe UI", system-ui, sans-serif; --bg: #070b12; --text: #d8e6f5; --muted: #7b8ea8; --accent: #38d6ff; --accent-text: #04121c;
    --good: #4ee49a; --bad: #ff5c6c; --you: #ffb547; --msg: #a98bff; --line: #1c2a3f;
    --title-font: 600 16px var(--font); --title-spacing: .18em; --title-shadow: none; --section-font: 600 11px var(--font);
    --border: 1px solid #1c2a3f; --header-bg: linear-gradient(180deg, #0b1220, #070b12); --chip-border: 1px solid #1c2a3f;
    --chip-radius: 999px; --chip-bg: transparent; --map-bg: radial-gradient(circle at 50% 50%, #0e1a2c 0, #070b12 70%);
    --empty-text: #7b8ea8; --empty-bg: transparent; --panel: #0d1420; --radius: 10px; --radius-lg: 14px;
    --approval-border: 1px solid #ff5c6c; --approval-bg: #2a0f16; --item-radius: 8px; --item-bg: #111a29; --item-text: #d8e6f5;
    --item-meta: #7b8ea8; --item-shadow: none; --item-jarvis-bg: #0e2030; --footer-bg: #0d1420; --input-bg: #0a111c;
    --input-border: 1px solid #1c2a3f; --input-text: #d8e6f5; --focus: #38d6ff22; --placeholder: #5d6f88;
    --btn-bg: #12324a; --btn-text: #d8e6f5; --btn-border: 1px solid #1f4d6d; --btn-shadow: none; --btn-danger: #3a1219; --btn-good: #103a28;
    --drawer-bg: #0c1522ee; --drawer-border: 1px solid #1c2a3f; --drawer-text: #d8e6f5; --drawer-muted: #7b8ea8;
    --drawer-shadow: none; --drawer-title-font: 600 18px var(--font); --pre-bg: #0a111c; --pre-border: 1px solid #1c2a3f;
    --step-line: #1c2a3f; --node-label: #d8e6f5; --node-sub: #7b8ea8; --node-font: 600 13px var(--font);
  }

  /* ---------- theme: Village (cartoon village builder) ---------- */
  body.village {
    --font: "Nunito", "Segoe UI", sans-serif; --bg: #3b7d2a; --text: #fff8e6; --muted: #f3dfb0; --accent: #ffcf3a; --accent-text: #4a2c0a;
    --good: #6fd43a; --bad: #ff4b3a; --you: #ffcf3a; --msg: #b07a3a; --line: #c9a36a;
    --title-font: 26px "Lilita One", var(--font); --title-spacing: .04em; --title-shadow: 0 3px 0 #6b3b0f, 0 0 2px #000;
    --section-font: 16px "Lilita One", var(--font);
    --border: 4px solid #5a3410; --header-bg: linear-gradient(180deg, #a76a2f, #7d4a1b); --chip-border: 3px solid #5a3410;
    --chip-radius: 12px; --chip-bg: #4a2a0c; --map-bg:
      radial-gradient(ellipse 62% 58% at 50% 54%, #7fce4a 0 58%, #63b23a 62%, #e9d39a 64%, #e3c987 67%, #3aa3d8 70%, #2b88c2 100%);
    --empty-text: #4a2c0a; --empty-bg: #f3e1b5ee; --panel: #8a5523; --radius: 12px; --radius-lg: 16px;
    --approval-border: 4px solid #b3261e; --approval-bg: #fff1d6; --item-radius: 10px; --item-bg: #f6e6bf; --item-text: #4a2c0a;
    --item-meta: #8a5a2b; --item-shadow: 0 3px 0 #c9a36a; --item-jarvis-bg: #fff7dd; --footer-bg: linear-gradient(0deg, #7d4a1b, #a76a2f);
    --input-bg: #fff4d6; --input-border: 3px solid #5a3410; --input-text: #4a2c0a; --focus: #ffcf3a66; --placeholder: #a07a4a;
    --btn-bg: #53b33b; --btn-text: #fff; --btn-border: 3px solid #2d6a1d; --btn-shadow: 0 4px 0 #2d6a1d; --btn-danger: #e2483a;
    --btn-good: #53b33b; --drawer-bg: #f6e6bf; --drawer-border: 5px solid #7d4a1b; --drawer-text: #4a2c0a; --drawer-muted: #8a5a2b;
    --drawer-shadow: 0 8px 0 #5a3410; --drawer-title-font: 24px "Lilita One", var(--font); --pre-bg: #fff8e6; --pre-border: 2px solid #c9a36a;
    --step-line: #c9a36a; --node-label: #fff8e6; --node-sub: #fff1c9; --node-font: 14px "Lilita One", var(--font);
  }
  body.village .approval .q { color: #4a2c0a; }
  body.village .label, body.village .sub { paint-order: stroke; stroke: #3b2208; stroke-width: 3px; stroke-linejoin: round; }
  body.village button.danger { border-color: #8f1f15; box-shadow: 0 4px 0 #8f1f15; }
  body.village .themes button:not(.on) { color: #f3dfb0; box-shadow: none; border: none; }

  /* ---------- theme: Stark HUD ---------- */
  body.hud {
    --font: "Rajdhani", "Segoe UI", sans-serif; --bg: #02060c; --text: #bfefff; --muted: #4f8fa8; --accent: #4fe3ff; --accent-text: #02121a;
    --good: #5dffb0; --bad: #ff3d55; --you: #ffc24a; --msg: #ffc24a; --line: #0f3b4f;
    --title-font: 700 15px "Orbitron", var(--font); --title-spacing: .32em; --title-shadow: 0 0 12px #4fe3ff99;
    --section-font: 600 11px "Orbitron", var(--font);
    --border: 1px solid #0f3b4f; --header-bg: linear-gradient(180deg, #031420, #02060c); --chip-border: 1px solid #13506a;
    --chip-radius: 2px; --chip-bg: #031520; --map-bg:
      radial-gradient(circle at 50% 52%, #062236 0, #02060c 65%),
      repeating-linear-gradient(0deg, transparent 0 39px, #0a2a3a55 39px 40px), repeating-linear-gradient(90deg, transparent 0 39px, #0a2a3a55 39px 40px);
    --empty-text: #4f8fa8; --empty-bg: transparent; --panel: #030c14; --radius: 2px; --radius-lg: 4px;
    --approval-border: 1px solid #ff3d55; --approval-bg: #1a0610; --item-radius: 2px; --item-bg: #04131e; --item-text: #bfefff;
    --item-meta: #4f8fa8; --item-shadow: inset 0 0 0 1px #0c3346; --item-jarvis-bg: #052233; --footer-bg: #030c14;
    --input-bg: #020a12; --input-border: 1px solid #13506a; --input-text: #bfefff; --focus: #4fe3ff33; --placeholder: #2f6b84;
    --btn-bg: #052a3a; --btn-text: #4fe3ff; --btn-border: 1px solid #4fe3ff; --btn-shadow: 0 0 10px #4fe3ff33; --btn-danger: #2a0712;
    --btn-good: #052a1c; --drawer-bg: #020d16ee; --drawer-border: 1px solid #4fe3ff66; --drawer-text: #bfefff; --drawer-muted: #4f8fa8;
    --drawer-shadow: 0 0 30px #4fe3ff22; --drawer-title-font: 700 17px "Orbitron", var(--font); --pre-bg: #020a12; --pre-border: 1px solid #0f3b4f;
    --step-line: #0f3b4f; --node-label: #bfefff; --node-sub: #4f8fa8; --node-font: 600 13px "Orbitron", var(--font);
  }
  body.hud::after { content: ""; position: fixed; inset: 0; pointer-events: none;
                    background: repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px); }
  body.hud button.danger { color: #ff3d55; border-color: #ff3d55; }
  body.hud .item { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
</style>
</head>
<body class="command">
<header>
  <h1 id="title">J.A.R.V.I.S. &middot; COMMAND CENTER</h1>
  <div class="chips">
    <span class="chip" id="conn"><span class="dot"></span>connecting</span>
    <span class="chip"><span id="agents-word">agents</span> <b id="count">0</b>/<b id="max">5</b></span>
    <span class="chip"><span id="working-word">working</span> <b id="working">0</b></span>
    <span class="chip"><span id="needs-word">needs you</span> <b id="needs">0</b></span>
    <div class="themes" id="themes"></div>
    <div class="themes"><button id="dim" title="Switch between the 3D and 2D view">3D</button></div>
  </div>
</header>
<main>
  <section id="map">
    <div id="scene3d"></div>
    <div id="hint">drag to orbit · scroll to zoom · click a unit · right-click for actions · 1/2/3 themes · space spin · esc reset</div>
    <svg id="svg"></svg>
    <div class="empty" id="empty"></div>
    <div id="drawer"></div>
  </section>
  <aside>
    <div id="approvals"></div>
    <h2 id="feed-title">ACTIVITY</h2>
    <div id="feed"></div>
  </aside>
</main>
<footer>
  <input type="text" id="cmd" autocomplete="off">
  <button id="send">Send</button>
</footer>
<div id="tip"></div>
<div id="ctx"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get("token");
const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const agents = {};
let selected = null;
const VERBS = { web_search: "searching the web", read_file: "reading a file", list_files: "looking through files",
  find_files: "finding files", write_file: "writing a file", get_weather: "checking the weather",
  calendar_events: "checking the calendar", check_email: "reading email", read_discord: "reading Discord",
  run_project_command: "running a project command", send_to_phone: "sending to your phone",
  send_message: "messaging a teammate", ask_user: "asking you something", finish: "finishing up", remember: "noting something" };

// ---------- helpers ----------
function api(path, body) {
  return fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN },
                       body: JSON.stringify(body) }).then(r => r.json());
}
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function txt(parent, text, attrs) { const t = el("text", attrs, parent); t.textContent = text; return t; }
function emoji(parent, text, attrs) { return txt(parent, text, { ...attrs, class: "emoji" }); }  // in colour, not black outlines
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function clock(t) { return new Date(t * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }); }
function nameOf(id) { return id === "jarvis" ? T.words.jarvis : id === "user" ? T.words.user : agents[id]?.info.name || id; }
function spin(parent, seconds, reverse) {
  el("animateTransform", { attributeName: "transform", type: "rotate", from: reverse ? "360" : "0", to: reverse ? "0" : "360",
                           dur: seconds + "s", repeatCount: "indefinite" }, parent);
}

// ---------- themes ----------
// Each theme sets the words, the status colours, how nodes are drawn, and what flies along a message.
const ROLE_ICONS = [[/research|find|search|scout/i, "🏹"], [/writ|draft|blurb|copy/i, "🧙"], [/review|check|edit|verif|qa/i, "🛡️"],
                    [/code|build|dev|engineer/i, "🔨"], [/plan|strateg|lead|manag/i, "🗺️"], [/data|analy|number|stat/i, "📊"],
                    [/design|art|visual/i, "🎨"], [/email|mail|message|comm/i, "🕊️"]];
const roleIcon = info => (ROLE_ICONS.find(([re]) => re.test(info.role + " " + info.name)) || [0, "⚔️"])[1];

const THEMES = {
  command: {
    words: { title: "J.A.R.V.I.S. · COMMAND CENTER", jarvis: "JARVIS", user: "You", agents: "agents", working: "working",
             needs: "needs you", feed: "ACTIVITY", send: "Send", placeholder: "Tell Jarvis what to do (works like talking to him)...",
             empty: 'No agents yet. Tell Jarvis something like "get a researcher and a writer to put together a one-page guide to the best budget mechanical keyboards".',
             approval: "needs your OK" },
    status: { starting: "#38d6ff", working: "#38d6ff", waiting: "#ffb547", "needs you": "#ff5c6c", done: "#4ee49a", stopped: "#5b6577", failed: "#ff5c6c" },
    statusWord: s => s,
    node(g, kind, info, color) {
      const big = kind === "jarvis", r = big ? 46 : 36;
      const halo = el("circle", { r: r + 10, fill: color, opacity: .12 }, g);
      el("circle", { r, fill: "#0b1626", stroke: color, "stroke-width": big ? 3 : 2.5 }, g);
      el("circle", { r: r - 7, fill: "none", stroke: color, "stroke-opacity": .35, "stroke-dasharray": "3 5" }, g);

let T = THEMES.command, themeKey = "command";

function grow(circle, to) {
  const start = performance.now(), from = +circle.getAttribute("r");
  (function step(now) {
    const k = Math.min(1, (now - start) / 700);
    circle.setAttribute("r", from + (to - from) * k); circle.setAttribute("opacity", 1 - k);
    k < 1 ? requestAnimationFrame(step) : circle.remove();
  })(start);
}

function applyTheme(key, save) {
  if (!THEMES[key]) key = "command";
  themeKey = key; T = THEMES[key];
  const three = document.body.classList.contains("three");  // keep the 3D/2D choice when the theme changes
  document.body.className = key + (three ? " three" : "");
  const w = T.words;
  document.getElementById("title").textContent = w.title;
  document.title = w.title;
  for (const id of ["agents", "working", "needs"]) document.getElementById(id + "-word").textContent = w[id];
  document.getElementById("feed-title").textContent = w.feed;
  document.getElementById("send").textContent = w.send;
  document.getElementById("cmd").placeholder = w.placeholder;
  document.getElementById("empty").textContent = w.empty;
  for (const b of document.querySelectorAll("#themes button")) b.classList.toggle("on", b.dataset.theme === key);
  for (const card of document.querySelectorAll(".approval .who")) card.textContent = `${card.dataset.who} ${w.approval}`;
  if (save) api("/theme", { theme: key });
  scene3d?.setTheme(key, agents);
  render(); refreshDrawer();
}

// ---------- map ----------
const defs = el("defs", {}, svg);
defs.innerHTML = `<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>`;
const layer = { edges: el("g", {}, svg), dots: el("g", {}, svg), nodes: el("g", {}, svg), fx: el("g", {}, svg) };
function size() { const r = svg.getBoundingClientRect(); return { w: r.width || 800, h: r.height || 600 }; }
function positions() {
  const { w, h } = size();
  const pos = { jarvis: { x: w / 2, y: h / 2 + 20 }, user: { x: w / 2, y: Math.max(80, h / 2 - Math.min(w, h) * 0.38) } };
  const ids = Object.keys(agents);
  const rx = Math.max(90, Math.min(w / 2 - 110, Math.min(w, h) * 0.42));
  const ry = Math.max(90, Math.min(h / 2 - 100, Math.min(w, h) * 0.34));
  ids.forEach((id, i) => {
    // an arc from Jarvis's right, round the bottom, to his left, keeping the top clear for the user
    const deg = ids.length === 1 ? 90 : -20 + (220 * i) / (ids.length - 1);
    const a = deg * Math.PI / 180;
    pos[id] = { x: w / 2 + rx * Math.cos(a), y: h / 2 + 20 + ry * Math.sin(a) };
  });
  return pos;
}
// ---------- 3D (scene3d.js) with the 2D map as the fallback ----------
let scene3d = null;
function counters() {
  const list = Object.values(agents).map(a => a.info.status);
  document.getElementById("count").textContent = list.filter(s => !["done", "stopped", "failed"].includes(s)).length;
  document.getElementById("working").textContent = list.filter(s => s === "working" || s === "starting").length;
  document.getElementById("needs").textContent = list.filter(s => s === "needs you").length + document.querySelectorAll(".approval").length;
  document.getElementById("empty").style.display = Object.keys(agents).length ? "none" : "block";
}
async function start3D() {
  try {
    if (!window.WebGLRenderingContext) throw new Error("no WebGL");
    const { createScene } = await import(`/scene3d.js?token=${encodeURIComponent(TOKEN)}`);
    scene3d = createScene(document.getElementById("scene3d"), {
      theme: () => themeKey, words: () => T.words, statusWord: s => T.statusWord(s), roleIcon,
      activityOf: id => agents[id]?.activity || "",
      onHover: showTip, onSelect: id => openDrawer(id), onJarvis: () => document.getElementById("cmd").focus(),
      onUser: () => { const a = document.querySelector(".approval"); if (a) a.scrollIntoView({ behavior: "smooth" }); },
      onContext: showMenu,
    });
    document.body.classList.add("three");
    document.getElementById("dim").textContent = "2D";
    render();
  } catch (err) {
    console.warn("3D view unavailable, using 2D:", err);
    scene3d = null; document.body.classList.remove("three");
    document.getElementById("dim").textContent = "3D";
  }
}
function toggle3D() {
  const three = !document.body.classList.contains("three");
  try { localStorage.setItem("jarvis-3d", three ? "1" : "0"); } catch (e) {}
  if (three && !scene3d) { start3D(); return; }
  document.body.classList.toggle("three", three);
  document.getElementById("dim").textContent = three ? "2D" : "3D";
  render();
}
function showTip(id, x, y) {
  const tip = document.getElementById("tip");
  if (!id) { tip.style.display = "none"; return; }
  let html;
  if (id === "jarvis") html = `<b>${esc(T.words.jarvis)}</b><br>Leading ${document.getElementById("count").textContent} active. Click to give an order.`;
  else if (id === "user") html = `<b>${esc(T.words.user)}</b><br>${document.querySelectorAll(".approval").length} waiting for your OK.`;
  else {
    const a = agents[id]; if (!a) return;
    html = `<b>${esc(a.info.name)}</b> · ${esc(T.statusWord(a.info.status))}<br>${esc(a.info.role)}` +
           (a.activity ? `<br><i>${esc(a.activity)}</i>` : "") + `<br>${(a.steps || []).length} steps · click to open, right-click for actions`;
  }
  tip.innerHTML = html; tip.style.display = "block";
  tip.style.left = Math.min(x + 16, innerWidth - 300) + "px"; tip.style.top = Math.min(y + 16, innerHeight - 120) + "px";
}
function showMenu(id, x, y) {
  const a = agents[id], menu = document.getElementById("ctx"); if (!a) return;
  const live = !["done", "stopped", "failed"].includes(a.info.status);
  menu.innerHTML = `<div style="padding:4px 8px;font-weight:800">${esc(a.info.name)}</div>
    <button data-act="open">Open</button>${live ? '<button data-act="msg">Message…</button>' : ""}
    ${a.info.result ? '<button data-act="result">Show result</button>' : ""}${live ? '<button class="danger" data-act="stop">Stop</button>' : ""}`;
  menu.style.display = "block";
  menu.style.left = Math.min(x, innerWidth - 190) + "px"; menu.style.top = Math.min(y, innerHeight - 180) + "px";
  menu.onclick = ev => {
    const act = ev.target.dataset.act; if (!act) return;
    menu.style.display = "none";
    openDrawer(id); scene3d?.focus(id);
    if (act === "msg") setTimeout(() => document.getElementById("dm")?.focus(), 50);
    if (act === "result") document.getElementById("d-result")?.scrollIntoView({ behavior: "smooth" });
    if (act === "stop") stopAgent();
  };
}
document.addEventListener("click", ev => { if (!ev.target.closest("#ctx")) document.getElementById("ctx").style.display = "none"; });
document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") { if (ev.key === "Escape") ev.target.blur(); return; }
  const keys = Object.keys(THEMES);
  if (["1", "2", "3"].includes(ev.key) && keys[+ev.key - 1]) applyTheme(keys[+ev.key - 1], true);
  else if (ev.key === "Escape") { closeDrawer(); scene3d?.reset(); document.getElementById("ctx").style.display = "none"; }
  else if (ev.key === " ") { ev.preventDefault(); scene3d?.toggleRotate(); }
  else if (ev.key === "/") { ev.preventDefault(); document.getElementById("cmd").focus(); }
});

function render() {
  counters();
  if (scene3d && document.body.classList.contains("three")) { scene3d.sync(agents); return; }
  layer.edges.innerHTML = ""; layer.nodes.innerHTML = "";
  const pos = positions();
  const line = (a, b, color, toUser) => el("line", { x1: pos[a].x, y1: pos[a].y, x2: pos[b].x, y2: pos[b].y, ...T.edge(color, toUser) }, layer.edges);
  line("user", "jarvis", T.status.waiting, true);
  for (const id of Object.keys(agents)) line("jarvis", id, T.status[agents[id].info.status] || T.status.working);
  const place = (id, kind, info) => {
    const g = el("g", { class: "node", transform: `translate(${pos[id].x},${pos[id].y})` }, layer.nodes);
    const color = kind === "jarvis" ? T.status.working : kind === "user" ? T.status.waiting : (T.status[info.status] || T.status.working);
    const r = T.node(g, kind, info || {}, color);
    if (kind === "agent") {
      txt(g, T.statusWord(info.status), { y: r + (themeKey === "village" ? 34 : themeKey === "hud" ? 44 : 22), class: "sub" });
      const doing = agents[id].activity || "";
      txt(g, doing.length > 26 ? doing.slice(0, 25) + "…" : doing,
          { y: r + (themeKey === "village" ? 48 : themeKey === "hud" ? 58 : 37), class: "sub" });
      g.addEventListener("click", () => openDrawer(id));
    }
  };
  place("user", "user"); place("jarvis", "jarvis");
  for (const [id, a] of Object.entries(agents)) place(id, "agent", a.info);
  document.getElementById("empty").style.display = Object.keys(agents).length ? "none" : "block";
  const list = Object.values(agents).map(a => a.info.status);
  document.getElementById("count").textContent = list.filter(s => !["done", "stopped", "failed"].includes(s)).length;
  document.getElementById("working").textContent = list.filter(s => s === "working" || s === "starting").length;
  document.getElementById("needs").textContent = list.filter(s => s === "needs you").length + document.querySelectorAll(".approval").length;
}
function flyMessage(from, to, color, kind) {
  if (scene3d && document.body.classList.contains("three")) { scene3d.message(from, to, kind); return; }
  const pos = positions();
  if (!pos[from] || !pos[to]) return;
  const parts = T.particle(layer.dots, color, kind);
  const start = performance.now(), dur = themeKey === "village" ? 1500 : 1100;
  const arc = themeKey === "village" ? 60 : 0;   // scrolls fly in a little arc
  (function step(now) {
    const k = Math.min(1, (now - start) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const x = pos[from].x + (pos[to].x - pos[from].x) * e, y = pos[from].y + (pos[to].y - pos[from].y) * e - arc * Math.sin(Math.PI * e);
    for (const p of parts) {
      if (p.tagName === "text") { p.setAttribute("x", x); p.setAttribute("y", y); }
      else { p.setAttribute("cx", x); p.setAttribute("cy", y); }
    }
    if (k < 1) requestAnimationFrame(step);
    else { parts.forEach(p => p.remove()); if (kind === "result") T.burst(layer.fx, pos[to].x, pos[to].y); }
  })(start);
}

// ---------- feed & drawer ----------
function feed(cls, meta, text, agentId) {
  const box = document.getElementById("feed");
  const d = document.createElement("div");
  d.className = "item " + cls; d.dataset.agent = agentId || "";
  const full = String(text ?? ""), long = full.length > 320;
  d.innerHTML = `<div class="meta">${esc(meta)}</div><span class="txt">${esc(long ? full.slice(0, 300) + "…" : full)}</span>`
              + (long ? ` <a href="#" class="more">show more</a>` : "");
  if (long) d.querySelector(".more").onclick = ev => {
    ev.preventDefault(); const open = ev.target.textContent === "show less";
    d.querySelector(".txt").textContent = open ? full.slice(0, 300) + "…" : full;
    ev.target.textContent = open ? "show more" : "show less";
  };
  if (agentId) d.addEventListener("click", ev => {   // jump to that agent
    if (ev.target.classList.contains("more") || !agents[agentId]) return;
    openDrawer(agentId); scene3d?.focus(agentId);
  });
  box.appendChild(d);
  while (box.children.length > 400) box.firstChild.remove();
  if (selected && agentId && agentId !== selected) d.style.display = "none";
  box.scrollTop = box.scrollHeight;
}
function openDrawer(id) {
  // Built once per agent; refreshDrawer() updates only what changes, so a half-typed message and the buttons stay put.
  if (selected !== id || !document.getElementById("drawer").classList.contains("open")) {
    selected = id;
    const info = agents[id].info;
    const drawer = document.getElementById("drawer");
    drawer.innerHTML = `<button class="close" onclick="closeDrawer()">&times;</button>
      <h3>${esc(info.name)}</h3><div class="role" id="d-role"></div>
      <div class="section">TASK</div><pre>${esc(info.task)}</pre>
      <div id="d-result"></div>
      <div class="section">RECENT STEPS</div><div class="steps" id="d-steps"></div>
      <div id="d-controls">
        <div class="row"><input type="text" id="dm" placeholder="Message ${esc(info.name)}..."><button onclick="sendDM()">Send</button></div>
        <div class="row"><button class="danger" onclick="stopAgent()">Stop ${esc(info.name)}</button></div>
      </div>`;
    drawer.classList.add("open");
    document.getElementById("dm").addEventListener("keydown", e => { if (e.key === "Enter") sendDM(); });
    for (const d of document.querySelectorAll("#feed .item")) d.style.display = (!d.dataset.agent || d.dataset.agent === id) ? "" : "none";
  }
  refreshDrawer();
}
function refreshDrawer() {
  if (!selected || !agents[selected]) return;
  const a = agents[selected], info = a.info;
  document.getElementById("d-role").innerHTML = `${esc(info.role)} &middot; <span style="color:${T.status[info.status]}">${esc(T.statusWord(info.status))}</span>
    &middot; ${(a.steps || []).length || info.steps || 0} steps`;
  document.getElementById("d-result").innerHTML = info.result ? `<div class="section">RESULT</div><pre>${esc(info.result)}</pre>` : "";
  document.getElementById("d-steps").innerHTML =
    (a.steps || []).slice(-12).reverse().map(s => `<div>${esc(s)}</div>`).join("") || "<div>No steps yet.</div>";
  document.getElementById("d-controls").style.display = ["done", "stopped", "failed"].includes(info.status) ? "none" : "";
}
function closeDrawer() {
  selected = null; document.getElementById("drawer").classList.remove("open");
  for (const d of document.querySelectorAll("#feed .item")) d.style.display = "";
}
function sendDM() {
  const input = document.getElementById("dm"); const text = input.value.trim(); if (!text) return;
  api("/message", { agent: selected, text });  // it shows up in the feed when Jarvis delivers it
  input.value = "";
}
function stopAgent() { api("/stop", { agent: selected }); }
function approvalCard(e) {
  const box = document.getElementById("approvals");
  const d = document.createElement("div"); d.className = "approval"; d.id = "ap-" + e.approval;
  d.innerHTML = `<div class="who" data-who="${esc(e.who)}">${esc(e.who)} ${esc(T.words.approval)}</div><div class="q">${esc(e.question)}</div>
    <button class="good">Yes</button><button class="danger">No</button>`;
  d.children[2].onclick = () => api("/approve", { approval: e.approval, yes: true });
  d.children[3].onclick = () => api("/approve", { approval: e.approval, yes: false });
  box.appendChild(d); render();
}

// ---------- events ----------
const seen = new Set();
function handle(e) {
  if (seen.has(e.id)) return; seen.add(e.id);
  const t = clock(e.time);
  switch (e.type) {
    case "agent":
      agents[e.agent] = agents[e.agent] || { info: { id: e.agent, name: e.name, role: e.role, task: e.task, status: "starting" }, steps: [] };
      feed("act", `${t} · new agent`, `${e.name}: ${e.role}`, e.agent); render(); break;
    case "status": {
      const a = agents[e.agent]; if (!a) break;
      a.info.status = e.status; if (e.note) a.activity = e.note;
      if (["done", "failed", "needs you"].includes(e.status))
        feed(e.status === "done" ? "res" : "warn", `${t} · ${a.info.name}`, `${T.statusWord(e.status)}${e.note ? ": " + e.note : ""}`, e.agent);
      render(); if (selected === e.agent) refreshDrawer(); break;
    }
    case "activity": {
      const a = agents[e.agent]; if (!a) break;
      const verb = VERBS[e.tool] || e.tool.replace(/_/g, " ");
      a.activity = verb; a.steps.push(`${verb}: ${e.result}`); a.info.steps = a.steps.length;
      feed("act", `${t} · ${a.info.name} · ${verb}`, e.result, e.agent);
      render(); if (selected === e.agent) refreshDrawer(); break;
    }
    case "message": {
      const from = e.sender, to = e.to === "user" ? "user" : e.to;
      flyMessage(agents[from] || from === "user" ? from : "jarvis", agents[to] ? to : (to === "user" ? "user" : "jarvis"),
                 to === "user" ? T.status["needs you"] : getComputedStyle(document.body).getPropertyValue("--msg").trim(), "msg");
      const label = e.kind === "update" ? `${nameOf(from)} · update` : `${nameOf(from)} → ${nameOf(to)}`;
      feed(to === "user" ? "warn" : "msg", `${t} · ${label}`, e.text, agents[from] ? from : (agents[to] ? to : ""));
      break;
    }
    case "result": {
      const a = agents[e.agent]; if (!a) break;
      a.info.result = e.text; flyMessage(e.agent, "jarvis", T.status.done, "result");
      feed("res", `${t} · ${a.info.name} · result`, e.text, e.agent);
      if (selected === e.agent) refreshDrawer(); break;
    }
    case "approval": approvalCard(e); feed("warn", `${t} · ${e.who} · ${T.words.approval}`, e.question); break;
    case "approval_done": document.getElementById("ap-" + e.approval)?.remove(); render();
      feed("you", `${t} · ${e.who}`, e.approved ? "approved" : "declined"); break;
    case "jarvis":
      if (e.direction === "in") { feed("you", `${t} · ${T.words.user} → ${T.words.jarvis}`, e.text); flyMessage("user", "jarvis", T.status.waiting, "user"); }
      else { feed("jar", `${t} · ${T.words.jarvis}`, e.text); flyMessage("jarvis", "user", T.status.working, "msg"); }
      break;
    case "theme": if (e.theme !== themeKey) applyTheme(e.theme, false); break;
  }
}

function connect() {
  const conn = document.getElementById("conn");
  const source = new EventSource(`/events?token=${encodeURIComponent(TOKEN)}`);
  source.onopen = () => { conn.className = "chip live"; conn.innerHTML = '<span class="dot"></span>live'; };
  source.onmessage = m => handle(JSON.parse(m.data));
  source.onerror = () => { conn.className = "chip"; conn.innerHTML = '<span class="dot"></span>reconnecting'; };
}
fetch(`/state?token=${encodeURIComponent(TOKEN)}`).then(r => r.json()).then(state => {
  document.getElementById("max").textContent = state.max_agents;
  const picker = document.getElementById("themes");
  for (const [key, label] of Object.entries(state.themes)) {
    const b = document.createElement("button"); b.textContent = label; b.dataset.theme = key;
    b.onclick = () => applyTheme(key, true); picker.appendChild(b);
  }
  applyTheme(state.theme, false);
  for (const a of state.agents) agents[a.id] = { info: a, steps: [] };
  for (const e of state.events) handle(e);
  for (const a of state.agents) agents[a.id].info = a;
  for (const p of state.approvals) if (!document.getElementById("ap-" + p.approval)) approvalCard(p);
  render(); connect();
  document.getElementById("dim").onclick = toggle3D;
  let want3D = true;
  try { want3D = localStorage.getItem("jarvis-3d") !== "0"; } catch (e) {}
  if (want3D) start3D();
});
const cmd = document.getElementById("cmd");
function sendCommand() { const text = cmd.value.trim(); if (!text) return; api("/command", { text }); cmd.value = ""; }
document.getElementById("send").onclick = sendCommand;
cmd.addEventListener("keydown", e => { if (e.key === "Enter") sendCommand(); });
window.addEventListener("resize", render);
</script>
</body>
